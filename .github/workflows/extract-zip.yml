name: Extract uploaded zip (review PR only)

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Tracked repository ZIP archive path to review"
        required: true
        default: "μchordbot_v0.2.zip"
      strip_top_folder:
        description: "Archive contains one enclosing directory"
        required: true
        type: boolean
        default: true

# pull-requests: write is required to open the review PR; this draft
# must not be merged until workflow token permissions are approved.
permissions:
  contents: write
  pull-requests: write

jobs:
  extract:
    runs-on: ubuntu-latest
    concurrency:
      group: extract-zip-review
      cancel-in-progress: false
    steps:
      - name: Checkout accepted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Locate safe tracked ZIP
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [[ "$ZIP_PATH" == /* || "$ZIP_PATH" == -* || "$ZIP_PATH" == *".."* || "$ZIP_PATH" != *.zip ]]; then
            echo "Rejected unsafe archive path" >&2
            exit 1
          fi
          git ls-files --error-unmatch -- "$ZIP_PATH" >/dev/null
          test -f "$ZIP_PATH"

      - name: Validate and stage safe archive contents
        shell: bash
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
          STRIP_TOP: ${{ inputs.strip_top_folder }}
        run: |
          set -euo pipefail
          python3 .github/scripts/safe_extract_zip.py --zip "$ZIP_PATH" --repo . --strip "$STRIP_TOP"
          # Match the previous extraction contract: the processed input
          # archive itself is removed in the review branch's diff.
          rm -- "$ZIP_PATH"

      - name: Create dedicated review branch
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extraction diff; no PR needed."
            exit 0
          fi
          branch="import/zip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "Review ZIP extraction from $ZIP_PATH"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "Review extracted ZIP: $ZIP_PATH" \
            --body "Manual ZIP extraction, review only. Validate diff and tests before any merge or Pages publication. Run: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}."
