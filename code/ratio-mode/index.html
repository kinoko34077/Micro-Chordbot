<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101727">
  <title>周波数比・簡易版 | μChordbot</title>
  <link rel="icon" href="../icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><a href="../" aria-label="μChordbot 通常版へ戻る" class="back">‹ μ</a><div><strong>周波数比・簡易版</strong><small>μChordbot / Ratio Mode</small></div></div>
      <div class="transport">
        <button type="button" id="play" class="primary">▶ 再生</button>
        <button type="button" id="stop">■ 停止</button>
        <label>BPM <input id="bpm" type="number" min="20" max="300" step="1" value="110"></label>
        <label class="check"><input id="loop" type="checkbox" checked>ループ</label>
        <label>音色 <select id="wave"><option value="sine">sine</option><option value="triangle">triangle</option><option value="square">square</option><option value="sawtooth">sawtooth</option></select></label>
      </div>
      <div class="tools">
        <button type="button" id="undo" aria-label="元に戻す" title="元に戻す">↶</button>
        <button type="button" id="redo" aria-label="やり直す" title="やり直す">↷</button>
        <button type="button" id="openIO">入出力</button>
      </div>
    </header>
    <main class="main">
      <div class="workspace-header">
        <div><div class="eyebrow">PROGRESSION</div><input id="title" aria-label="進行名" maxlength="120" value="比率コード進行"></div>
        <div class="workspace-actions"><button type="button" id="newSection">＋ セクション</button><span id="saveState" role="status">端末内保存</span></div>
      </div>
      <div id="timeline" class="timeline" tabindex="0" role="region" aria-label="コード進行（横スクロール）"></div>
      <div class="library">
        <div class="library-label"><strong>名前付き比率</strong><small>タップすると選択中のコードに挿入</small></div>
        <div id="presetChips" class="preset-chips" role="group" aria-label="登録済み比率"></div>
        <div class="preset-add">
          <label>名前 <input id="presetName" placeholder="例: 11th" maxlength="64"></label>
          <label>比率 <input id="presetRatio" placeholder="8,11,12" spellcheck="false"></label>
          <button type="button" id="addPreset">＋ 登録</button>
        </div>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <section class="editor" aria-label="選択コードの編集">
      <div class="editor-heading">
        <div><span class="eyebrow">SELECTED CHORD</span> <strong id="selectionLabel">A / 1</strong> <span id="hzReadout" class="subreadout"></span></div>
        <div class="editor-actions">
          <button type="button" id="preview">♫ 試聴</button>
          <button type="button" id="moveLeft" title="前に移動">←</button>
          <button type="button" id="moveRight" title="後ろに移動">→</button>
          <button type="button" id="duplicate" title="コードを複製">複製</button>
          <button type="button" id="remove" title="コードを削除">削除</button>
          <button type="button" id="addStep">＋ コード</button>
        </div>
      </div>
      <div class="editor-fields">
        <label class="ratio-field">周波数比 / コード名 <input id="editExpr" type="text" spellcheck="false" autocomplete="off" placeholder="4,5,6 / 8:11/2:6 / Major"></label>
        <label class="pitch-field">ベース音高・セント <input id="editPitch" type="text" spellcheck="false" autocomplete="off" placeholder="C4 / A#5 +50￠ / D‡5 / Bd6"></label>
        <label class="beats-field">拍数 <input id="editBeats" type="number" min="0.25" max="64" step="0.25"></label>
        <label class="section-field">セクション名 <input id="editSectionName" type="text" maxlength="64"></label>
        <label class="repeat-field">反復回数 <input id="editRepeat" type="number" min="1" max="16" step="1"></label>
        <button type="button" id="removeSection" title="このセクションを削除">セクション削除</button>
      </div>
      <div class="editor-note">比率の最小値がベース音。‡ = +50¢、d = −50¢。分数・カンマ・コロンで入力できます。</div>
    </section>
  </div>
  <dialog id="ioDialog" aria-label="コード進行の入出力">
    <div class="dialog-header"><strong>コード進行の入出力</strong><button type="button" id="ioClose" aria-label="閉じる">×</button></div>
    <div class="dialog-options"><label>形式 <select id="ioFormat"><option value="text">進行テキスト</option><option value="json">JSON</option></select></label><button type="button" id="ioExport">表示・コピー用</button><button type="button" id="ioDownload">ファイル保存</button></div>
    <textarea id="ioText" spellcheck="false" rows="14" placeholder="進行データを貼り付け"></textarea>
    <div class="dialog-options"><label class="file-label">ファイル読込 <input id="ioFile" type="file" accept=".json,.txt,application/json,text/plain"></label><button type="button" id="ioImport" class="primary">このデータを読み込む</button></div>
    <p id="ioStatus" role="status"></p>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
